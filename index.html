<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>南国会旅行貯金</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&family=Noto+Sans+JP:wght@400;500&display=swap" rel="stylesheet">

  <style>
   body {
  margin: 0;
  font-family: 'Noto Sans JP', sans-serif;
  color: #023047;
}

.overlay {
  min-height: 100vh;
  background-image: url("nangoku.jpg");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  background-attachment: fixed; 
  text-align: center;
  padding-bottom: 40px;
}

    h1 {
       margin: 0;
      padding-top: 40px;
      font-family: 'Poppins', sans-serif;
      letter-spacing: 1px;
    }

    .status {
      margin: 20px auto;
      padding: 16px;
      max-width: 320px;
      background: rgba(255,255,255,0.85);
      border-radius: 18px;
      font-size: 16px;
      line-height: 1.7;
    }

    button {
      margin-top: 5px;
      padding: 18px 32px;
      font-size: 16px;
      font-family: 'Poppins', 'Noto Sans JP', sans-serif;
      border: none;
      border-radius: 999px;
      background: linear-gradient(135deg, #ffb703, #ffd166);
      color: #fff;
      box-shadow: 0 8px 20px rgba(255,183,3,0.35);
      transition: all 0.15s ease;
    }

    button:active {
      transform: scale(0.96);
      box-shadow: 0 4px 10px rgba(255,183,3,0.25);
    }

    select {
      margin-top: 20px;
      padding: 10px 14px;
      font-size: 15px;
      border-radius: 12px;
      border: none;
      font-family: 'Noto Sans JP', sans-serif;
    }

    .message {
      margin-top: 15px;
      font-size: 15px;
    }

    .history {
      margin: 40px auto;
      max-width: 320px;
      background: rgba(255,255,255,0.85);
      border-radius: 18px;
      padding: 12px 20px;
      text-align: left;
      font-size: 15px;
    }
.accordion {
  width: 100%;
  background: #ffffff;  /* ← 透過やめる */
  border: none;
  font-size: 16px;
  font-family: 'Poppins', 'Noto Sans JP', sans-serif;
  color: #023047;
  padding: 12px 0;
  cursor: pointer;
  border-radius: 12px;
}

.history-body {
  display: none;
  margin-top: 10px;
}

    ul {
      padding-left: 0;
      list-style: none;
    }

    li {
      margin-bottom: 6px;
    }

    section {
  margin: 40px auto;
  max-width: 320px;
}

section h2 {
  font-size: 20px;
  margin-bottom: 4px; /* ← ここを縮める */
  font-family: 'Poppins', 'Noto Sans JP', sans-serif;
  letter-spacing: 0.5px;
}


.sub-action {
  padding-top: 24px;
  border-top: 1px dashed rgba(0, 0, 0, 0.25);
}

.sub-action h2 {
  font-size: 14px;
  opacity: 0.75;
}
.sub-action select,
.sub-action button {
  width: 200px;
}
.sub-action button {
  white-space: nowrap;
}
  </style>
</head>

<body>
<div class="overlay">

  <h1>🌴 南国会旅行貯金</h1>

  <div class="status" id="status"></div>

<section class="main-action">
  <h2>💰 今月の貯金</h2>
  <button onclick="saveCurrent()">今月の3,000円貯金した！</button>
  <div class="message" id="currentMessage"></div>
</section>

<section class="sub-action">
  <h2>🗓️ さかのぼって貯金</h2>
  <select id="backMonth"></select><br>
  <button onclick="saveBack()">選択月を貯金</button>
</section>


  <div class="message" id="message"></div>

<div class="history">
  <button class="accordion" onclick="toggleHistory()">
    ▼ 貯金履歴を見る
  </button>

  <div id="historyBody" class="history-body">
    <ul id="list"></ul>
  </div>
</div>


</div>

<script>
  const AMOUNT = 3000;
  const listEl = document.getElementById("list");
  const statusEl = document.getElementById("status");
  const messageEl = document.getElementById("message");
  const backMonthEl = document.getElementById("backMonth");
  const currentMessageEl = document.getElementById("currentMessage");


  function labelFromDate(d) {
    return d.getFullYear() + "年" + (d.getMonth() + 1) + "月";
  }

  function load() {
  const data = JSON.parse(localStorage.getItem("nangokukai")) || [];

  // 🌴 年月を「新しい順」にソート
  data.sort((a, b) => {
    const da = new Date(a.replace("年", "/").replace("月", "/1"));
    const db = new Date(b.replace("年", "/").replace("月", "/1"));
    return db - da;
  });

  listEl.innerHTML = "";

  data.forEach(d => {
    const li = document.createElement("li");
    li.textContent = "✅ " + d;
    listEl.appendChild(li);
  });

  const months = data.length;
  const total = months * AMOUNT;

  statusEl.innerHTML =
    `💰 累計貯金額：<strong>${total.toLocaleString()}円</strong><br>
     📅 貯金した月数：<strong>${months}か月</strong>`;
}


function saveLabel(label, targetMessageEl) {
  const data = JSON.parse(localStorage.getItem("nangokukai")) || [];

  if (data.includes(label)) {
    targetMessageEl.textContent = "その月はもう貯金済みだよ 🌺";
    return;
  }

  data.push(label);
  localStorage.setItem("nangokukai", JSON.stringify(data));
  targetMessageEl.textContent = "ナイス！イタリアに一歩近づいた 🌴✈️";
  load();
}


function saveCurrent() {
  saveLabel(labelFromDate(new Date()), currentMessageEl);
}

function saveBack() {
  saveLabel(backMonthEl.value, messageEl);
}

  function setupBackMonths() {
    const now = new Date();
    for (let i = 1; i <= 12; i++) {
      const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
      const opt = document.createElement("option");
      opt.value = labelFromDate(d);
      opt.textContent = opt.value;
      backMonthEl.appendChild(opt);
    }
  }

  setupBackMonths();
  load();

  function toggleHistory() {
  const body = document.getElementById("historyBody");
  const btn = document.querySelector(".accordion");

  if (body.style.display === "block") {
    body.style.display = "none";
    btn.textContent = "▼ 貯金履歴を見る";
  } else {
    body.style.display = "block";
    btn.textContent = "▲ 貯金履歴を閉じる";
  }
}

</script>

</body>
</html>
